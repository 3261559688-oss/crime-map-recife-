name: 🚨 Auto Update + LLM (30min full pipeline)

# ✅ 每 30 分钟完整跑：抓 RSS → 合并 DB → 跑 LLM → 刷展示层 → 更新前端 JSON
# 需要 GitHub Secret: WQ_API_KEY (万擎 API key)
# 在 https://github.com/3261559688-oss/crime-map-recife-/settings/secrets/actions 配置

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_all.py'
      - 'scripts/llm_call_v2.py'
      - '.github/workflows/update-data.yml'

concurrency:
  group: update-data
  cancel-in-progress: false

# 🔑 关键：给 GITHUB_TOKEN 写权限，否则 git push 会 403
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          # 拿完整 token，后续 push 用
          persist-credentials: true
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: pip install requests feedparser python-dateutil pytz

      - name: 💾 Cache DB
        uses: actions/cache@v4
        with:
          path: data/crime_map.db
          key: crime-map-db-${{ github.run_id }}
          restore-keys: |
            crime-map-db-

      - name: 🔧 Ensure DB exists (rebuild from ndjson if missing)
        run: |
          if [ ! -f data/crime_map.db ] && [ -f public/api/incidents.ndjson ]; then
            python3 scripts/rebuild_db_from_ndjson.py
          fi

      - name: 📡 Step 1 - Fetch RSS
        run: python3 scripts/fetch_all.py

      - name: 🔀 Step 2 - Rename to raw layer
        run: |
          mv public/rss_incidents.json public/raw_incidents.json
          mv public/meta.json public/raw_meta.json
          # 先把 git 上的前端 JSON 拉回（避免误覆盖）
          git checkout HEAD -- public/rss_incidents.json public/rss_incidents_lite.json public/meta.json 2>/dev/null || true

      - name: 🔗 Step 3 - Merge raw → DB
        run: python3 scripts/merge_raw_to_db.py

      # ⚡ 策略 A：增量跑 LLM
      # 每次只跑 100 条，保证 25min 内能跑完（即使万擎接口慢）
      # 新数据每 30min 通常 < 50 条，所以一两轮就追平
      # 旧的未跑数据会在每轮里慢慢被消化
      - name: 🧠 Step 4 - LLM A (is_crime) [incremental, max 100]
        env:
          WQ_API_KEY: ${{ secrets.WQ_API_KEY }}
        run: |
          if [ -z "$WQ_API_KEY" ]; then
            echo "⚠️ WQ_API_KEY 未配置，跳过 LLM"
            exit 0
          fi
          # 单步 5 分钟内必须返回（避免某条卡死整个流水线）
          timeout 300 python3 scripts/llm_call_v2.py --stage a --provider wanqing --limit 100 --workers 5 || echo "⚠️ A 段超时或部分失败，下次继续"

      - name: 🧠 Step 5 - LLM B (type) [incremental, max 100]
        env:
          WQ_API_KEY: ${{ secrets.WQ_API_KEY }}
        if: env.WQ_API_KEY != ''
        run: timeout 300 python3 scripts/llm_call_v2.py --stage b --provider wanqing --limit 100 --workers 5 || echo "⚠️ B 段超时或部分失败"

      - name: 🧠 Step 6 - LLM C (geo) [incremental, max 100]
        env:
          WQ_API_KEY: ${{ secrets.WQ_API_KEY }}
        if: env.WQ_API_KEY != ''
        run: timeout 300 python3 scripts/llm_call_v2.py --stage c --provider wanqing --limit 100 --workers 5 || echo "⚠️ C 段超时或部分失败"

      - name: 🔄 Step 7 - Refresh published layer
        run: python3 scripts/refresh_published.py

      - name: 📤 Step 8 - Export front-end JSON
        run: python3 scripts/export_from_published.py

      - name: 🔖 Step 9 - Inject build version
        run: python3 scripts/inject_build_version.py

      - name: 📊 Summary
        run: |
          echo "=== Front-end JSON ==="
          python3 -c "
          import json
          d = json.load(open('public/rss_incidents.json'))
          ts = sorted([x.get('pub_date','') for x in d if x.get('pub_date')], reverse=True)
          print(f'Total: {len(d)} incidents')
          print(f'Latest: {ts[0] if ts else \"?\"}')
          "

      - name: 💾 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rss_incidents.json public/rss_incidents_lite.json public/raw_incidents.json public/raw_meta.json public/version.json public/index.html
          if git diff --staged --quiet; then
            echo "📭 无变化"
          else
            COUNT=$(python3 -c "import json; print(len(json.load(open('public/rss_incidents.json'))))" 2>/dev/null || echo "?")
            LATEST=$(python3 -c "import json; d=json.load(open('public/rss_incidents.json')); ts=sorted([x.get('pub_date','') for x in d if x.get('pub_date')],reverse=True); print(ts[0] if ts else '?')" 2>/dev/null || echo "?")
            git commit -m "🤖 auto: ${COUNT} incidents (latest ${LATEST})"
            # 🔁 防止与你的本地 push 冲突：先 rebase，再 push；失败重试 3 次
            for i in 1 2 3; do
              git pull --rebase origin main && git push && { echo "✅ 已推送"; break; } || echo "⚠️ push 第 $i 次失败，重试..."
              sleep 5
            done
          fi
