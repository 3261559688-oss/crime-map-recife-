name: 🚨 Auto Update + LLM (1h full pipeline)
# ✅ 每 1 小时完整跑：抓 RSS → 合并 DB → 跑 LLM → 刷展示层 → 更新前端 JSON
# 改为 1h: RSS源本身 1-2h 更新，30min 空跑浪费 GHA 额度且导致 DB lock
# 需要 GitHub Secret: WQ_API_KEY (万擎 API key)
# 在 https://github.com/3261559688-oss/crime-map-recife-/settings/secrets/actions 配置
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_all.py'
      - 'scripts/llm_call_v2.py'
      - '.github/workflows/update-data.yml'
concurrency:
  group: update-data
  cancel-in-progress: true  # 新任务来了取消旧任务，避免 DB lock
# 🔑 关键：给 GITHUB_TOKEN 写权限，否则 git push 会 403
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install deps
        run: pip install requests feedparser python-dateutil pytz

      # ✅ Fix: DB 直接来自 git checkout（不用 cache，永远有完整历史数据）
      - name: 🔧 Ensure DB exists (rebuild from ndjson if missing)
        run: |
          if [ ! -f data/crime_map.db ] && [ -f public/api/incidents.ndjson ]; then
            python3 scripts/rebuild_db_from_ndjson.py
          fi
          if [ -f data/crime_map.db ]; then
            echo "✅ DB 存在: $(du -sh data/crime_map.db | cut -f1)"
            python3 -c "import sqlite3; c=sqlite3.connect('data/crime_map.db'); print('DB 行数:', c.execute('SELECT COUNT(*) FROM dwd_intl_crime_incident_di').fetchone()[0])" 2>/dev/null || echo "(表不存在，将新建)"
          else
            echo "⚠️ DB 不存在，将从头创建"
          fi

      - name: 📡 Step 1 - Fetch RSS
        run: python3 scripts/fetch_all.py

      - name: 🔀 Step 2 - Rename to raw layer
        run: |
          mv public/rss_incidents.json public/raw_incidents.json
          mv public/meta.json public/raw_meta.json
          # 先把 git 上的前端 JSON 拉回（避免误覆盖）
          git checkout HEAD -- public/rss_incidents.json public/rss_incidents_lite.json public/meta.json 2>/dev/null || true

      - name: 🔗 Step 3 - Merge raw → DB
        run: python3 scripts/merge_raw_to_db.py

      # ⚡ 增量跑 LLM：每次最多 300 条，保证 20min 内跑完
      - name: 🧠 Step 4 - LLM A (is_crime) [incremental, max 300]
        env:
          WQ_API_KEY: ${{ secrets.WQ_API_KEY }}
        run: |
          if [ -z "$WQ_API_KEY" ]; then
            echo "::error::❌ WQ_API_KEY 未配置！请到 GitHub Secrets 添加"
            echo "::error::访问：https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          timeout 600 python3 scripts/llm_call_v2.py --stage a --provider wanqing --limit 300 --workers 10 || echo "⚠️ A 段超时或部分失败，下次继续"

      # ✅ Fix: 用 secrets 直接判断，不用 env.WQ_API_KEY（env 在 if 条件里拿不到 secret）
      - name: 🧠 Step 5 - LLM B (type) [incremental, max 300]
        env:
          WQ_API_KEY: ${{ secrets.WQ_API_KEY }}
        run: |
          if [ -z "$WQ_API_KEY" ]; then echo "⚠️ 跳过 B 段（无 API key）"; exit 0; fi
          timeout 600 python3 scripts/llm_call_v2.py --stage b --provider wanqing --limit 300 --workers 10 || echo "⚠️ B 段超时或部分失败"

      - name: 🧠 Step 6 - LLM C (geo) [incremental, max 300]
        env:
          WQ_API_KEY: ${{ secrets.WQ_API_KEY }}
        run: |
          if [ -z "$WQ_API_KEY" ]; then echo "⚠️ 跳过 C 段（无 API key）"; exit 0; fi
          timeout 600 python3 scripts/llm_call_v2.py --stage c --provider wanqing --limit 300 --workers 10 || echo "⚠️ C 段超时或部分失败"

      - name: 🔄 Step 7 - Refresh published layer
        run: python3 scripts/refresh_published.py

      - name: 📤 Step 8 - Export front-end JSON (temporary raw 7d until LLM catch-up)
        run: python3 scripts/export_raw_7d_for_frontend.py

      - name: 🔖 Step 9 - Inject build version
        run: python3 scripts/inject_build_version.py

      - name: 📊 Summary
        run: |
          echo "=== Front-end JSON ==="
          python3 -c "
          import json
          d = json.load(open('public/rss_incidents.json'))
          ts = sorted([x.get('pub_date','') for x in d if x.get('pub_date')], reverse=True)
          print(f'Total: {len(d)} incidents')
          print(f'Latest: {ts[0] if ts else \"?\"}')
          "
          echo "=== DB 统计 ==="
          python3 -c "
          import sqlite3
          c = sqlite3.connect('data/crime_map.db')
          total = c.execute('SELECT COUNT(*) FROM dwd_intl_crime_incident_di').fetchone()[0]
          a_done = c.execute('SELECT COUNT(*) FROM dwd_intl_crime_incident_di WHERE llm_a_is_crime IS NOT NULL').fetchone()[0]
          b_done = c.execute('SELECT COUNT(*) FROM dwd_intl_crime_incident_di WHERE llm_b_type IS NOT NULL AND llm_b_type != \"\"').fetchone()[0]
          print(f'DB 总行数: {total}')
          print(f'A 完成: {a_done} ({a_done*100//total if total else 0}%)')
          print(f'B 完成: {b_done} ({b_done*100//total if total else 0}%)')
          " 2>/dev/null || echo "(DB 统计失败)"

      - name: 🩺 Generate Ops Dashboard Health JSON
        env:
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_TOKEN: ${{ secrets.UMAMI_TOKEN }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 scripts/gen_health.py || echo "⚠️ health JSON 生成失败（不阻塞主流程）"
          ls -la public/health/ || true

      # ✅ Fix: 数据有无变化都强制 push，确保 Vercel 每次都重新部署
      - name: 💾 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rss_incidents.json public/rss_incidents_lite.json \
                  public/api/incidents.ndjson public/meta.json \
                  public/raw_incidents.json public/raw_meta.json \
                  public/version.json public/health/ \
                  data/crime_map.db
          COUNT=$(python3 -c "import json; print(len(json.load(open('public/rss_incidents.json'))))" 2>/dev/null || echo "?")
          LATEST=$(python3 -c "import json; d=json.load(open('public/rss_incidents.json')); ts=sorted([x.get('pub_date','') for x in d if x.get('pub_date')],reverse=True); print(ts[0] if ts else '?')" 2>/dev/null || echo "?")
          # --allow-empty 确保即使数据无变化也会推 commit，Vercel 一定触发部署
          git commit --allow-empty -m "🤖 auto: ${COUNT} incidents (latest ${LATEST})"
          # 🔁 push，失败重试 3 次（不用 rebase，直接 push，避免 unstaged changes 报错）
          for i in 1 2 3; do
            git push origin main && { echo "✅ 已推送"; break; } || { echo "⚠️ push 第 $i 次失败，拉远端再重试..."; git fetch origin && git reset --soft origin/main && git push origin main && { echo "✅ 已推送（重试成功）"; break; }; }
            sleep 5
          done

      # 🚀 主动触发 Vercel 部署（bot commit 不会自动触发 Vercel，需要 deploy hook）
      - name: 🚀 Trigger Vercel Deploy
        if: always()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
            echo "Vercel deploy hook status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "201" ]; then
              echo "✅ Vercel 部署已触发"
            else
              echo "⚠️ Vercel hook 返回 $HTTP_STATUS"
            fi
          else
            echo "⚠️ VERCEL_DEPLOY_HOOK secret 未设置，跳过"
          fi
