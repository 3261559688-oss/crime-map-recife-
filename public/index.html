*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text-main);overflow:hidden;transition:background .3s}

body{background:var(--bg-page);display:flex;align-items:center;justify-content:center;min-height:100vh}
.phone{position:relative;width:100vw;height:100vh;background:var(--bg-phone);overflow:hidden;transition:background .3s}

@media (min-width:768px){
  body{background:var(--bg-desktop-grad)}
  .phone{
    width:390px;height:844px;
    border-radius:48px;
    box-shadow:
      0 0 0 12px var(--phone-frame-1),
      0 0 0 14px var(--phone-frame-2),
      var(--phone-shadow);
  }
  .phone::before{
    content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:120px;height:32px;background:#000;border-radius:20px;z-index:9999;
  }
  .phone::after{
    content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:130px;height:5px;background:var(--text-strong);border-radius:3px;z-index:9999;opacity:.9
  }
  .desktop-hint{position:fixed;top:30px;left:30px;color:var(--text-muted);font-size:13px;line-height:1.6;max-width:240px}
  .desktop-hint h3{color:var(--text-strong);font-size:16px;margin-bottom:8px}
  .desktop-hint a{color:#dc2626}
}
@media (max-width:767px){.desktop-hint{display:none}}

#map{position:absolute;inset:0;z-index:1;background:var(--bg-phone)}

.statusbar{position:absolute;top:0;left:0;right:0;height:env(safe-area-inset-top);min-height:44px;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;color:var(--text-clock);pointer-events:none}
.statusbar .time{font-size:15px}
@media (min-width:768px){
  .statusbar{padding-top:18px;padding-left:32px;padding-right:32px}
}

/* 顶部 */
.topbar{position:absolute;top:0;left:0;right:0;z-index:100;padding-top:calc(env(safe-area-inset-top) + 8px);padding-left:12px;padding-right:12px;padding-bottom:8px;background:linear-gradient(180deg,var(--bg-statusbar) 0%,var(--bg-statusbar-fade) 70%,transparent 100%);backdrop-filter:blur(12px)}
@media (min-width:768px){.topbar{padding-top:54px}}

.title-row{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 6px;gap:10px}
.title{font-size:16px;font-weight:700;color:var(--text-strong);display:flex;align-items:center;gap:7px}
.title .dot{width:7px;height:7px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

/* 城市选择按钮 */
/* 主题切换按钮 */
.theme-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--bg-chip);border:1px solid var(--border);border-radius:50%;cursor:pointer;font-size:16px;transition:.2s;flex-shrink:0}
.theme-btn:active{transform:scale(.9) rotate(180deg)}

.city-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;background:rgba(220,38,38,.18);border:1px solid rgba(220,38,38,.4);border-radius:14px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap;max-width:160px}
[data-theme="light"] .city-btn{background:rgba(220,38,38,.92);color:#fff}
.city-btn:active{transform:scale(.95)}
.city-btn .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px}
.city-btn .arrow{font-size:9px;opacity:.7}

/* 类型 */
.type-bar{display:flex;gap:5px;overflow-x:auto;padding:2px 4px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.type-bar::-webkit-scrollbar{display:none}
.type-chip{flex-shrink:0;padding:5px 11px;background:var(--bg-chip);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--text-muted);cursor:pointer;transition:.2s;white-space:nowrap}
.type-chip:active{transform:scale(.92)}
.type-chip.active{background:var(--bg-chip-active);color:var(--text-strong);border-color:var(--border-strong)}

/* 城市选择弹层 */
.city-modal{position:absolute;inset:0;z-index:300;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.city-modal.show{display:flex}
.city-panel{width:100%;background:var(--bg-modal);border-radius:18px 18px 0 0;max-height:75%;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.city-panel-header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-soft)}
.city-panel-title{font-size:16px;font-weight:700;color:var(--text-strong)}
.city-panel-close{width:28px;height:28px;border-radius:50%;background:var(--bg-chip);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;cursor:pointer}
.city-search{padding:10px 14px;border-bottom:1px solid var(--border-soft)}
.city-search input{width:100%;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;color:var(--text-main);font-size:14px;outline:none;-webkit-user-select:auto;user-select:auto}
.city-search input::placeholder{color:var(--text-faint)}
.city-list{flex:1;overflow-y:auto;padding:6px 8px 16px;-webkit-overflow-scrolling:touch}
.city-opt{padding:11px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:.15s}
.city-opt:active{background:var(--bg-card-hover)}
.city-opt.active{background:rgba(220,38,38,.18);color:var(--text-strong)}
[data-theme="light"] .city-opt.active{background:rgba(220,38,38,.12)}
.city-opt-left{display:flex;align-items:center;gap:10px}
.city-opt-name{font-size:14px;color:var(--text-main);font-weight:500}
.city-opt-state{font-size:10px;color:var(--text-muted)}
.city-opt-count{font-size:11px;color:var(--text-muted);background:var(--bg-input);padding:2px 8px;border-radius:8px}
.city-opt.active .city-opt-count{background:rgba(220,38,38,.4);color:#fff}
.city-opt-empty{padding:30px;text-align:center;color:var(--text-faint);font-size:13px}

/* Marker */
.pm{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#fff;font-size:14px;border:2px solid #fff;box-shadow:var(--shadow-popup);font-weight:700}
.pm.homicidio{background:#7f1d1d}
.pm.roubo{background:#dc2626}
.pm.furto{background:#d97706}
.pm.estupro{background:#be185d}
.pm.trafico{background:#7e22ce}
.pm.sequestro{background:#0891b2}
.pm.violencia{background:#ea580c}
.pm.policia{background:#1e40af}
.pm.faccao{background:#831843}
.pm.fraude{background:#0d9488}
.pm.veiculo{background:#374151}
.pm.menor{background:#a16207}
.pm.outros{background:#475569}

/* 弹窗 */
.leaflet-popup-content-wrapper{background:var(--bg-popup);color:var(--text-main);border-radius:14px;padding:0}
.leaflet-popup-content{margin:12px 14px;line-height:1.5;width:230px!important}
.leaflet-popup-tip{background:var(--bg-popup)}
.leaflet-popup-close-button{color:var(--text-muted)!important}
.pop-type{display:inline-block;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;text-transform:uppercase;margin-bottom:6px;color:#fff}
.pop-title{font-size:13px;font-weight:600;color:var(--text-strong);margin-bottom:6px;line-height:1.4}
.pop-meta{font-size:10px;color:var(--text-muted);margin-bottom:8px}
.pop-link{display:block;padding:8px;background:#dc2626;color:#fff;text-align:center;border-radius:8px;text-decoration:none;font-size:12px;font-weight:600}

/* 底部 sheet（可拖拽） */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg-sheet);border-radius:18px 18px 0 0;box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--border-soft);transition:transform .3s cubic-bezier(.4,0,.2,1),background .3s;height:60%;will-change:transform;touch-action:none}
.sheet.no-trans{transition:none}
.sheet-handle{display:flex;justify-content:center;padding:12px 10px 8px;cursor:grab;touch-action:none}
.sheet-handle:active{cursor:grabbing}
.sheet-handle-bar{width:40px;height:5px;background:var(--bg-sheet-handle);border-radius:3px;transition:background .2s}
.sheet.dragging .sheet-handle-bar{background:var(--bg-sheet-handle-active)}
.sheet-header{padding:0 16px 8px;display:flex;justify-content:space-between;align-items:flex-end}
.sheet-title{font-size:15px;font-weight:700;color:var(--text-strong)}
.sheet-count{font-size:11px;color:var(--text-muted)}
.sheet-body{flex:1;overflow-y:auto;padding:0 12px 20px;-webkit-overflow-scrolling:touch}

/* 列表项 */
.it{padding:10px 12px;background:var(--bg-card);border-radius:12px;margin-bottom:8px;cursor:pointer;border-left:3px solid transparent;transition:.2s}
.it:active{transform:scale(.98);background:var(--bg-card-hover)}
.it.active{background:rgba(220,38,38,.14);border-left-color:#dc2626}
[data-theme="light"] .it.active{background:rgba(220,38,38,.08)}
.it-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.it-emoji{font-size:14px}
.it-tag{font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.it-city{font-size:10px;color:var(--text-muted);margin-left:auto}
.it-title{font-size:12.5px;color:var(--text-main);line-height:1.4;font-weight:500;-webkit-user-select:text;user-select:text}
.it-source{font-size:9.5px;color:var(--text-faint);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.it-time{font-size:9.5px;color:#22c55e;font-weight:600}
.it-time.fresh{color:#fbbf24}
.it-time.hot{color:#ef4444;animation:pulse 2s infinite}

.loading{position:absolute;inset:0;background:var(--bg-loading);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.spin{width:32px;height:32px;border:3px solid var(--bg-card);border-top-color:#dc2626;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.loading-text{color:var(--text-muted);font-size:12px}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;backdrop-filter:blur(8px);max-width:80%}
.toast.show{opacity:1}

.empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px}

.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:9px!important;background:var(--bg-attr)!important;color:var(--text-muted)!important}
.leaflet-control-attribution a{color:var(--text-muted)!important}
</style>
</head>
<body>

<div class="desktop-hint">
  <h3>📱 Visualização Mobile</h3>
  <p>Otimizado para smartphone.<br><br>No celular abra:<br><a href="https://crime-map-recife.vercel.app/" target="_blank">crime-map-recife.vercel.app</a></p>
</div>

<div class="phone">
  <div class="statusbar">
    <span class="time" id="clock">9:41</span>
    <span>📶 5G 🔋</span>
  </div>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <div id="map"></div>

  <div class="topbar">
    <div class="title-row">
      <div class="title"><span class="dot"></span>Mapa do Crime</div>
      <div class="city-btn" id="cityBtn">
        <span>📍</span>
        <span class="label" id="cityBtnLabel">Brasil</span>
        <span class="arrow">▼</span>
      </div>
    </div>
    <div class="type-bar" id="typeBar"></div>
  </div>

  <!-- 城市选择弹层 -->
  <div class="city-modal" id="cityModal">
    <div class="city-panel">
      <div class="city-panel-header">
        <div class="city-panel-title">Escolher Cidade</div>
        <div class="city-panel-close" id="cityClose">✕</div>
      </div>
      <div class="city-search">
        <input type="text" id="citySearch" placeholder="🔍 Buscar cidade..." autocomplete="off">
      </div>
      <div class="city-list" id="cityList"></div>
    </div>
  </div>

  <div class="sheet" id="sheet" style="transform:translateY(calc(100% - 56px))">
    <div class="sheet-handle" id="sheetHandle">
      <div class="sheet-handle-bar"></div>
    </div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheetTitle">Ocorrências</div>
      <div class="sheet-count" id="sheetCount">0</div>
    </div>
    <div class="sheet-body" id="list"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const TYPE_EMOJI={homicidio:'🩸',roubo:'🔫',furto:'📱',estupro:'⚠️',trafico:'💊',sequestro:'🔗',violencia:'👊',policia:'👮',faccao:'🔥',fraude:'💳',veiculo:'🚗',menor:'👦',outros:'❗'};
const TYPE_LABEL={homicidio:'Homicídio',roubo:'Roubo',furto:'Furto',estupro:'Estupro',trafico:'Tráfico',sequestro:'Sequestro',violencia:'Violência',policia:'Polícia',faccao:'Facção',fraude:'Fraude',veiculo:'Veículo',menor:'Menor',outros:'Outros'};
const TYPE_COLOR={homicidio:'#7f1d1d',roubo:'#dc2626',furto:'#d97706',estupro:'#be185d',trafico:'#7e22ce',sequestro:'#0891b2',violencia:'#ea580c',policia:'#1e40af',faccao:'#831843',fraude:'#0d9488',veiculo:'#374151',menor:'#a16207',outros:'#475569'};

const CITY_COORDS={
  'Brasil':[-14.235,-51.925,4],
  'São Paulo':[-23.5505,-46.6333,11],
  'Rio de Janeiro':[-22.9068,-43.1729,11],
  'Recife':[-8.0476,-34.8770,12],
  'Salvador':[-12.9714,-38.5014,11],
  'Brasília':[-15.7975,-47.8919,11],
  'Fortaleza':[-3.7172,-38.5433,11],
  'Belo Horizonte':[-19.9167,-43.9345,11],
  'Porto Alegre':[-30.0346,-51.2177,11],
  'Curitiba':[-25.4284,-49.2733,11],
  'Caruaru':[-8.2842,-35.9760,12],
  'Osasco':[-23.5325,-46.7919,12],
  'São Gonçalo':[-22.8268,-43.0537,12],
  'Niterói':[-22.8833,-43.1036,12],
  'Porto Seguro':[-16.4497,-39.0647,12],
};

let allData=[],map,markers=[],curCity='Brasil',curType='all';

// 时钟
function updateClock(){
  const d=new Date();
  document.getElementById('clock').textContent=
    d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
updateClock();setInterval(updateClock,30000);

function showToast(msg,t=1500){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),t);
}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// 时间格式化：返回 "há 2 horas" / "há 3 dias"
function timeAgo(isoStr){
  if(!isoStr) return {text:'', cls:''};
  const t = new Date(isoStr).getTime();
  if(isNaN(t)) return {text:'', cls:''};
  const sec = Math.floor((Date.now()-t)/1000);
  if(sec < 60) return {text:'agora', cls:'hot'};
  if(sec < 3600) return {text:`há ${Math.floor(sec/60)}min`, cls:'hot'};
  if(sec < 86400){const h=Math.floor(sec/3600);return {text:`há ${h}h`, cls:h<6?'hot':'fresh'}}
  const d = Math.floor(sec/86400);
  if(d===1) return {text:'ontem', cls:'fresh'};
  if(d<7) return {text:`há ${d} dias`, cls:''};
  return {text:`há ${d}d`, cls:''};
}

function initMap(){
  map=L.map('map',{zoomControl:false,attributionControl:true}).setView([-14.235,-51.925],4);
  tileLayer = L.tileLayer(getTileUrl(),{maxZoom:19,subdomains:'abcd'}).addTo(map);
  setTimeout(()=>map.invalidateSize(),200);
  window.addEventListener('resize',()=>map.invalidateSize());
}

// ========== 主题切换 ==========
let tileLayer=null;
function getTileUrl(){
  const theme=document.documentElement.getAttribute('data-theme')||'dark';
  const style=theme==='light'?'light_all':'dark_all';
  return `https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`;
}
// 固定浅色主题
document.documentElement.setAttribute('data-theme','light');

// 城市统计
function getCityStats(){
  const counts={};
  allData.forEach(d=>{counts[d.city]=(counts[d.city]||0)+1});
  return counts;
}

// 渲染城市选择列表
function renderCityList(filter=''){
  const counts=getCityStats();
  const cities=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  
  const list=[];
  // 巴西全国置顶
  if(!filter || 'brasil'.includes(filter.toLowerCase())){
    list.push({name:'Brasil',count:allData.length,isAll:true});
  }
  cities.forEach(([city,n])=>{
    if(!filter || city.toLowerCase().includes(filter.toLowerCase())){
      const sample=allData.find(d=>d.city===city);
      list.push({name:city,count:n,state:sample?.state||''});
    }
  });
  
  const el=document.getElementById('cityList');
  if(list.length===0){
    el.innerHTML='<div class="city-opt-empty">Nenhuma cidade encontrada</div>';
    return;
  }
  el.innerHTML=list.map(c=>`
    <div class="city-opt ${curCity===c.name?'active':''}" data-city="${escapeHtml(c.name)}">
      <div class="city-opt-left">
        <span>${c.isAll?'🇧🇷':'📍'}</span>
        <div>
          <div class="city-opt-name">${escapeHtml(c.name)}</div>
          ${c.state?`<div class="city-opt-state">${escapeHtml(c.state)}</div>`:''}
        </div>
      </div>
      <div class="city-opt-count">${c.count}</div>
    </div>
  `).join('');
  
  el.querySelectorAll('.city-opt').forEach(opt=>{
    opt.onclick=()=>{
      switchCity(opt.dataset.city);
      closeCityModal();
    };
  });
}

function openCityModal(){
  document.getElementById('cityModal').classList.add('show');
  document.getElementById('citySearch').value='';
  renderCityList();
}
function closeCityModal(){
  document.getElementById('cityModal').classList.remove('show');
}

// 类型筛选
function renderTypeBar(){
  const filtered=curCity==='Brasil'?allData:allData.filter(d=>d.city===curCity);
  const counts={};
  filtered.forEach(d=>{counts[d.type]=(counts[d.type]||0)+1});
  
  const bar=document.getElementById('typeBar');
  let html=`<div class="type-chip ${curType==='all'?'active':''}" data-type="all">Todos · ${filtered.length}</div>`;
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([t,n])=>{
    html+=`<div class="type-chip ${curType===t?'active':''}" data-type="${t}">${TYPE_EMOJI[t]||'❗'} ${TYPE_LABEL[t]||t} · ${n}</div>`;
  });
  bar.innerHTML=html;
  
  bar.querySelectorAll('.type-chip').forEach(el=>{
    el.onclick=()=>switchType(el.dataset.type);
  });
}

function switchCity(city){
  curCity=city;
  curType='all';
  document.getElementById('cityBtnLabel').textContent=city;
  const [lat,lng,zoom]=CITY_COORDS[city]||[-14.235,-51.925,4];
  map.flyTo([lat,lng],zoom,{duration:.8});
  renderTypeBar();
  renderMarkers();
  renderList();
  showToast(`📍 ${city}`);
}

function switchType(t){
  curType=t;
  renderTypeBar();
  renderMarkers();
  renderList();
}

function getFilteredData(){
  let d=allData;
  if(curCity!=='Brasil')d=d.filter(x=>x.city===curCity);
  if(curType!=='all')d=d.filter(x=>x.type===curType);
  return d;
}

function renderMarkers(){
  if(window._cluster){map.removeLayer(window._cluster);}
  const cluster = L.markerClusterGroup({
    chunkedLoading: true,
    chunkInterval: 100,
    maxClusterRadius: 60,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
  });
  markers=[];
  const data=getFilteredData();
  data.forEach((d,idx)=>{
    const icon=L.divIcon({className:'',html:`<div class="pm ${d.type}">${TYPE_EMOJI[d.type]||'❗'}</div>`,iconSize:[32,32],iconAnchor:[16,16]});
    const m=L.marker([d.lat,d.lng],{icon});
    const html=`
      <span class="pop-type" style="background:${TYPE_COLOR[d.type]}">${TYPE_LABEL[d.type]||d.type}</span>
      <div class="pop-title">${escapeHtml(d.title)}</div>
      <div class="pop-meta">📍 ${escapeHtml(d.city)} · ${escapeHtml(d.source||'')}${d.pub_date?' · '+timeAgo(d.pub_date).text:''}</div>
      <a class="pop-link" href="${escapeHtml(d.link)}" target="_blank" rel="noopener">Ler notícia →</a>
    `;
    m.bindPopup(html,{maxWidth:260,minWidth:220,offset:[0,-8]});
    m.on('click',()=>highlightItem(idx));
    cluster.addLayer(m);
    markers.push(m);
  });
  map.addLayer(cluster);
  window._cluster = cluster;
}

function renderList(){
  const data=getFilteredData();
  document.getElementById('sheetCount').textContent=`${data.length} ocorrências`;
  document.getElementById('sheetTitle').textContent=curCity==='Brasil'?'🇧🇷 Brasil':'📍 '+curCity;
  
  const list=document.getElementById('list');
  if(data.length===0){list.innerHTML='<div class="empty">Nenhuma ocorrência</div>';return}
  
  list.innerHTML=data.map((d,idx)=>`
    <div class="it" data-idx="${idx}">
      <div class="it-row">
        <span class="it-emoji">${TYPE_EMOJI[d.type]||'❗'}</span>
        <span class="it-tag" style="background:${TYPE_COLOR[d.type]}">${TYPE_LABEL[d.type]||d.type}</span>
        <span class="it-city">${escapeHtml(d.city)}</span>
      </div>
      <div class="it-title">${escapeHtml(d.title)}</div>
      <div class="it-source"><span>${escapeHtml(d.source||'')}</span>${(()=>{const t=timeAgo(d.pub_date);return t.text?`<span class="it-time ${t.cls}">${t.text}</span>`:''})()}</div>
    </div>
  `).join('');
  
  list.querySelectorAll('.it').forEach(el=>{
    el.onclick=()=>{
      const idx=+el.dataset.idx;
      const d=data[idx];
      map.flyTo([d.lat,d.lng],14,{duration:.6});
      const m=markers[idx];
      setTimeout(()=>m&&m.openPopup(),650);
      highlightItem(idx);
    };
  });
}

function highlightItem(idx){
  document.querySelectorAll('.it').forEach(el=>el.classList.remove('active'));
  const el=document.querySelector(`.it[data-idx="${idx}"]`);
  if(el){
    el.classList.add('active');
    el.scrollIntoView({behavior:'smooth',block:'center'});
  }
  expandSheet();
}

// ========== Sheet 拖拽实现 ==========
const sheet=document.getElementById('sheet');
const sheetHandle=document.getElementById('sheetHandle');

let sheetH=0; // sheet 高度
let curOffset=0; // 当前 transform 偏移（0=完全展开，sheetH-56=收起）
let dragStartY=0;
let dragStartOffset=0;
let isDragging=false;

function getSheetH(){return sheet.offsetHeight}

function setOffset(offset, animated=false){
  const max=getSheetH()-56; // 56 = handle + header 露出高度
  offset=Math.max(0,Math.min(max,offset));
  curOffset=offset;
  if(animated)sheet.classList.remove('no-trans');
  else sheet.classList.add('no-trans');
  sheet.style.transform=`translateY(${offset}px)`;
}

function expandSheet(){setOffset(0,true)}
function collapseSheet(){setOffset(getSheetH()-56,true)}
function isCollapsed(){return curOffset>(getSheetH()-56)*0.5}

// 初始位置：收起
window.addEventListener('load',()=>{
  setTimeout(()=>{
    setOffset(getSheetH()-56,false);
  },50);
});

function onDragStart(e){
  isDragging=true;
  dragStartY=e.touches?e.touches[0].clientY:e.clientY;
  dragStartOffset=curOffset;
  sheet.classList.add('dragging','no-trans');
  e.preventDefault();
}
function onDragMove(e){
  if(!isDragging)return;
  const y=e.touches?e.touches[0].clientY:e.clientY;
  const dy=y-dragStartY;
  setOffset(dragStartOffset+dy,false);
  e.preventDefault();
}
function onDragEnd(){
  if(!isDragging)return;
  isDragging=false;
  sheet.classList.remove('dragging');
  // 自动吸附：根据当前位置吸附到最近的端点
  const max=getSheetH()-56;
  if(curOffset<max*0.4){
    expandSheet();
  }else{
    collapseSheet();
  }
}

sheetHandle.addEventListener('touchstart',onDragStart,{passive:false});
sheetHandle.addEventListener('touchmove',onDragMove,{passive:false});
sheetHandle.addEventListener('touchend',onDragEnd);
sheetHandle.addEventListener('mousedown',onDragStart);
window.addEventListener('mousemove',onDragMove);
window.addEventListener('mouseup',onDragEnd);

// 点击 handle 也能切换
sheetHandle.addEventListener('click',e=>{
  if(Math.abs(e.clientY-dragStartY)<3){ // 没移动太多 = 点击
    if(isCollapsed())expandSheet();
    else collapseSheet();
  }
});

// ========== 城市按钮 ==========
document.getElementById('cityBtn').addEventListener('click',openCityModal);
document.getElementById('cityClose').addEventListener('click',closeCityModal);
document.getElementById('cityModal').addEventListener('click',e=>{
  if(e.target.id==='cityModal')closeCityModal();
});
document.getElementById('citySearch').addEventListener('input',e=>{
  renderCityList(e.target.value);
});

// ========== 启动 ==========
async function init(){
  try{
    initMap();
    document.querySelector('.loading-text').textContent='Carregando 2000+ ocorrências...';
    const res=await fetch('/rss_incidents.json?_='+Date.now());
    allData=await res.json();
    document.querySelector('.loading-text').textContent=`Renderizando ${allData.length} pontos...`;
    renderTypeBar();
    // 让 loading 文字先渲染，再干重活
    await new Promise(r=>setTimeout(r,30));
    renderMarkers();
    renderList();
    document.getElementById('loading').style.display='none';
    setTimeout(()=>map.invalidateSize(),300);
  }catch(e){
    document.getElementById('loading').innerHTML=`<div style="color:#ef4444">Erro: ${e.message}</div>`;
  }
}
init();
</script>
</body>
</html>
